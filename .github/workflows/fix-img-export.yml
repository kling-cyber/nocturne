name: Fix NOCTURNE image export
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Fix stale IMG export
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('nocturne-vercel-3.5/backend/server/game.js')
          s = p.read_text()
          old = '''  imageModel:\n    IMG,'''
          new = '''  imageModel:\n    comfy.CHECKPOINT,'''
          if old not in s:
              raise SystemExit('Expected stale IMG export was not found')
          s = s.replace(old, new, 1)
          if '\n    IMG' in s or '\n  IMG' in s:
              raise SystemExit('Stale IMG reference remains')
          p.write_text(s)
          PY
          node --check nocturne-vercel-3.5/backend/server/game.js
          git diff --check
      - name: Commit and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add nocturne-vercel-3.5/backend/server/game.js
          git rm .github/workflows/fix-img-export.yml
          git commit -m 'Fix stale image model export'
          git push
