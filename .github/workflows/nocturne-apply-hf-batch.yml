name: Apply NOCTURNE HF batch integration

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch production files
        shell: python
        run: |
          from pathlib import Path
          import re, json
          root=Path('nocturne-vercel-3.5')
          b=root/'backend/server'
          f=root/'frontend'

          game=(b/'game.js').read_text()
          game=game.replace('const comfy = require("./comfy-client");','const visualBatch = require("./visual-batch");')
          game=game.replace('    this.cameraFrames = new Map();\n\n    this.make(players, options);','    this.cameraFrames = new Map();\n    this.visualCooldowns = new Map();\n\n    this.make(players, options);\n    visualBatch.register(this);')

          method=r'''  async visual(pid, payload = {}) {
    const actor=this.get(pid);
    if(!actor || !actor.alive || this.caseClosed) return;

    const result=visualBatch.request(this,pid,payload);
    if(result?.error){
      this.room.io.to(pid).emit('errorMessage',result.error);
      return;
    }

    const asset=result.asset;
    const title=`${asset.cameraId} // ${asset.kind.toUpperCase()} // ${asset.clock}`;
    const description=asset.kind==='cctv'
      ?`Cached CCTV evidence from ${asset.area}. The timestamp is the simulated case capture time.`
      :`Cached investigative scene photograph from ${asset.area}. It is an observation, not automatic truth.`;

    this.add({
      type:'visual', title, description,
      reliability:asset.kind==='cctv'?75:65,
      image:asset.path,
      source:asset.cameraId,
      visualAssetId:asset.id
    });

    this.event('VISUAL',`${actor.name} retrieved ${asset.kind.toUpperCase()} evidence from ${asset.cameraId}.`);

    this.room.io.to(pid).emit('visualReady',{
      title, description,
      reliability:asset.kind==='cctv'?75:65,
      image:asset.path
    });

    this.emit();
  }


'''
          pat=re.compile(r'  async visual\(pid, payload = \{\}\) \{.*?\n  \}\n\n\n  /\* =======================================================\n     PUBLIC STATE',re.S)
          game,n=pat.subn(method+'  /* =======================================================\n     PUBLIC STATE',game,count=1)
          if n!=1: raise SystemExit('visual method patch failed')

          old='''  emit() {\n\n    this.room.io\n      .to(this.room.code)'''
          new='''  emit() {\n\n    visualBatch.touch(this);\n\n    this.room.io\n      .to(this.room.code)'''
          if old not in game: raise SystemExit('emit marker missing')
          game=game.replace(old,new,1)
          game=game.replace('imageModel:\n    comfy.CHECKPOINT,','imageModel:\n    "Hugging Face ZeroGPU",')
          (b/'game.js').write_text(game)

          index=(b/'index.js').read_text()
          index=index.replace('const {GameRoom}=require("./game");','const {GameRoom}=require("./game");\nconst visualBatch=require("./visual-batch");',1)
          marker='app.disable("x-powered-by");\n\n'
          route="""app.get('/visual-cache/:caseId/:filename',(req,res)=>{\n  const file=visualBatch.getFile(req.params.caseId,req.params.filename);\n  if(!file)return res.status(404).end();\n  res.setHeader('Cache-Control','public, max-age=3600');\n  res.sendFile(file);\n});\n\n"""
          if route not in index: index=index.replace(marker,marker+route,1)
          (b/'index.js').write_text(index)

          app=(f/'app.js').read_text()
          if 'let visualCooldownUntil=0;' not in app: app=app.replace('let incomingQ=null;','let incomingQ=null;\nlet visualCooldownUntil=0;',1)
          old='''function visual(type){\n  setBusy(true, type === "cctv" ? "Retrieving CCTV frame..." : "Generating scene photograph...");'''
          new='''function visual(type){\n  const now=Date.now();\n  if(now<visualCooldownUntil){\n    const seconds=Math.ceil((visualCooldownUntil-now)/1000);\n    return toast(`Visual request cooldown: ${seconds}s remaining.`);\n  }\n  visualCooldownUntil=now+30000;\n  setBusy(true, type === "cctv" ? "Retrieving cached CCTV frame..." : "Retrieving cached scene photograph...");'''
          if old not in app: raise SystemExit('frontend visual marker missing')
          app=app.replace(old,new,1)
          old2='''function showVisual(d){\n\n  setBusy(false);'''
          new2='''function visualSrc(src){\n  const value=String(src||'');\n  if(!value)return '';\n  if(/^https?:\\/\\//i.test(value)||value.startsWith('data:'))return value;\n  return (SOCKET_URL||'')+value;\n}\n\nfunction showVisual(d){\n\n  setBusy(false);'''
          if old2 not in app: raise SystemExit('showVisual marker missing')
          app=app.replace(old2,new2,1)
          app=app.replace('src="${esc(d.image||\'\')}"','src="${esc(visualSrc(d.image||\'\'))}"',1)
          app=app.replace('src="${esc(e.image)}"','src="${esc(visualSrc(e.image))}"',1)
          # Fix duplicate selectCamera definition while touching this file.
          app=app.replace('function selectCamera(btn){document.querySelectorAll("[data-camera-id]").forEach(b=>b.classList.remove("selected"));btn.classList.add("selected");}\n','',1)
          (f/'app.js').write_text(app)

          pkg=root/'backend/package.json'
          data=json.loads(pkg.read_text())
          data['version']='4.1.0'
          pkg.write_text(json.dumps(data,indent=2)+'\n')

          ver=root/'VERSION.txt'
          if ver.exists():
            txt=ver.read_text()
            txt=txt.replace('NOCTURNE 4.0','NOCTURNE 4.1')
            if 'Hugging Face ZeroGPU batch visual generation' not in txt:
              txt+='\nNOCTURNE 4.1 visual system:\n- Hugging Face ZeroGPU batch visual generation\n- Global visual generation queue across active cases\n- Case-specific temporary visual cache\n- 30-second per-player visual request limiter\n- Cached visual access during gameplay\n'
            ver.write_text(txt)

      - name: Validate
        run: |
          node --check nocturne-vercel-3.5/backend/server/index.js
          node --check nocturne-vercel-3.5/backend/server/game.js
          node --check nocturne-vercel-3.5/backend/server/visual-batch.js
          node --check nocturne-vercel-3.5/backend/server/hf-client.js
          node --check nocturne-vercel-3.5/frontend/app.js

      - name: Commit and remove patch workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/nocturne-apply-hf-batch.yml
          git add nocturne-vercel-3.5 .github/workflows/nocturne-apply-hf-batch.yml
          git diff --cached --quiet || git commit -m "NOCTURNE 4.1 Hugging Face batch visual system"
          git push
