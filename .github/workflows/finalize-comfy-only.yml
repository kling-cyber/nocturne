name: Finalize NOCTURNE ComfyUI only
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  finalize:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Remove remaining Gemini image code
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('nocturne-vercel-3.5/backend/server/game.js')
          s = p.read_text()

          # Remove stale Gemini diagnostic log statements from the unavailable branch.
          s = re.sub(r'\n\s*console\.error\(\s*"\[NOCTURNE\] GEMINI_API_KEY present:",\s*!!geminiApiKey\s*\);', '', s, count=1, flags=re.S)
          s = re.sub(r'\n\s*console\.error\(\s*"\[NOCTURNE\] Image model:",\s*IMG\s*\);', '', s, count=1, flags=re.S)

          # Remove the now-dead else-if(false) branch by matching its braces safely.
          marker = '} else if (false) {'
          start = s.find(marker)
          if start != -1:
              open_brace = s.find('{', start + len(marker))
              depth = 1
              i = open_brace + 1
              state = 'code'
              while i < len(s) and depth:
                  c = s[i]
                  n = s[i + 1] if i + 1 < len(s) else ''
                  if state == 'code':
                      if c == '/' and n == '/': state = 'line'; i += 2; continue
                      if c == '/' and n == '*': state = 'block'; i += 2; continue
                      if c == "'": state = 'single'; i += 1; continue
                      if c == '"': state = 'double'; i += 1; continue
                      if c == '`': state = 'template'; i += 1; continue
                      if c == '{': depth += 1
                      elif c == '}': depth -= 1
                      i += 1
                  elif state == 'line':
                      if c == '\n': state = 'code'
                      i += 1
                  elif state == 'block':
                      if c == '*' and n == '/': state = 'code'; i += 2
                      else: i += 1
                  elif state == 'single':
                      if c == '\\': i += 2
                      elif c == "'": state = 'code'; i += 1
                      else: i += 1
                  elif state == 'double':
                      if c == '\\': i += 2
                      elif c == '"': state = 'code'; i += 1
                      else: i += 1
                  else:
                      if c == '\\': i += 2
                      elif c == '`': state = 'code'; i += 1
                      else: i += 1
              if depth:
                  raise SystemExit('Could not match Gemini branch braces')
              s = s[:start] + '}' + s[i:]

          # Ensure image generation is explicitly ComfyUI-only.
          if 'gemini' in s.lower() or 'GEMINI_' in s:
              raise SystemExit('Gemini image code still remains')
          if 'comfy.configured' not in s or 'comfy.request' not in s:
              raise SystemExit('ComfyUI image path missing')

          p.write_text(s)
          print('Final ComfyUI-only game configuration complete')
          PY
      - name: Validate backend
        run: |
          node --check nocturne-vercel-3.5/backend/server/game.js
          git diff --check
      - name: Remove temporary patch workflows and commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f .github/workflows/fix-comfy-only.yml .github/workflows/comfy-only-fix2.yml .github/workflows/comfy-only-fix3.yml .github/workflows/comfy-runtime-fix.yml .github/workflows/comfy-runtime-fix-final.yml .github/workflows/finalize-comfy-only.yml || true
          git add nocturne-vercel-3.5/backend/server/game.js
          git commit -m 'Finalize ComfyUI-only visual evidence engine'
          git push
