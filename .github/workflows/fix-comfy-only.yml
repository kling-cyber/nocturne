name: Fix ComfyUI-only image generation
on:
  workflow_dispatch:
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch game.js
        shell: python
        run: |
          from pathlib import Path
          import re
          p = Path('nocturne-vercel-3.5/backend/server/game.js')
          s = p.read_text()
          # Remove Gemini image client configuration while preserving OpenAI text AI.
          s, n1 = re.subn(r'\nconst geminiApiKey\s*=.*?;\n\nconst ai\s*=','\nconst ai =',s,count=1,flags=re.S)
          s, n2 = re.subn(r'\nconst geminiImageAi\s*=.*?;\n\nconst MODEL\s*=','\nconst MODEL =',s,count=1,flags=re.S)
          s, n3 = re.subn(r'\nconst IMG\s*=.*?;\n','\n',s,count=1,flags=re.S)
          # Replace the visual function's Gemini gate with a ComfyUI gate.
          old = '''    /*\n     * STEP 1\n     * Confirm that OpenAI exists.\n     */\n\n    if (!geminiImageAi) {\n\n      console.error(\n        "[NOCTURNE] Image generation unavailable."\n      );'''
          new = '''    /*\n     * STEP 1\n     * ComfyUI is the only image-generation engine.\n     */\n\n    if (!comfy.configured) {\n\n      console.error(\n        "[NOCTURNE] ComfyUI image generation unavailable."\n      );'''
          if old not in s:
              raise SystemExit('Gemini gate pattern not found')
          s = s.replace(old,new,1)
          # Remove the Gemini fallback branch after the ComfyUI branch, leaving a clear error if reached.
          pattern = r'''\n\s*} else if \(geminiImageAi\) \{.*?\n\s*}\n\n\s*if \(!image\) \{'''
          replacement = '''\n\n      }\n\n    }\n\n    if (!image) {'''
          s, n4 = re.subn(pattern,replacement,s,count=1,flags=re.S)
          if n4 != 1:
              raise SystemExit('Gemini fallback pattern not found')
          # Make the source label deterministic.
          s = s.replace('let imageSource = "Gemini";','let imageSource = "ComfyUI";',1)
          p.write_text(s)
          print('patch counts', n1,n2,n3,n4)
      - name: Validate
        run: |
          node --check nocturne-vercel-3.5/backend/server/game.js
          git diff --check
          grep -n "GEMINI\|gemini\|geminiImageAi\|Image model" nocturne-vercel-3.5/backend/server/game.js || true
          grep -n "comfy.configured\|comfy.request" nocturne-vercel-3.5/backend/server/game.js
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nocturne-vercel-3.5/backend/server/game.js
          git commit -m "Use ComfyUI only for visual evidence"
          git push
