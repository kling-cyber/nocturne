name: NOCTURNE UI CSS Fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix-ui:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply CSS-only layout fixes
        env:
          CSS_PATCH_B64: 
        run: |
          python3 -c "import base64,os;from pathlib import Path;p=Path('nocturne-vercel-3.5/frontend/styles.css');s=p.read_text(encoding='utf-8');m='/* NOCTURNE UI FIX 2026-09-05 */';a=base64.b64decode(os.environ['CSS_PATCH_B64']).decode();p.write_text(s if m in s else s+'\n'+a,encoding='utf-8')"
      - name: Commit CSS and remove temporary files
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nocturne-vercel-3.5/frontend/styles.css
          git rm -f .github/workflows/nocturne-ui-fix.yml nocturne-ui-fix-trigger.txt || true
          git commit -m "Fix NOCTURNE panel overflow and scrollbars"
          git push
