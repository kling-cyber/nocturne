name: patch-cctv-overlay
on:
  push:
    paths:
      - .github/nocturne-cctv-overlay-trigger
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index
        shell: python
        run: |
          from pathlib import Path
          p = Path('nocturne-vercel-3.5/frontend/index.html')
          s = p.read_text(encoding='utf-8')
          marker = '<script src="/app.js"></script>'
          insert = marker + '\n<script src="/cctv-overlay.js"></script>'
          if '/cctv-overlay.js' in s:
              print('CCTV overlay script already present')
          elif marker in s:
              p.write_text(s.replace(marker, insert, 1), encoding='utf-8')
              print('Inserted CCTV overlay script')
          else:
              raise SystemExit('Could not find app.js script marker')
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nocturne-vercel-3.5/frontend/index.html
          git diff --cached --quiet || git commit -m "Wire CCTV timestamp overlay"
          git push
