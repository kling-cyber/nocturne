name: Fix NOCTURNE ComfyUI runtime
on:
  push:
    branches:
      - main
  workflow_dispatch:
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Switch image engine to ComfyUI
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('nocturne-vercel-3.5/backend/server/game.js')
          s = p.read_text()

          gemini_key = '''const geminiApiKey =
  String(process.env.GEMINI_API_KEY || "").trim();

'''
          s = s.replace(gemini_key, '', 1)

          gemini_client = '''const geminiImageAi =
  OpenAI && geminiApiKey
    ? new OpenAI({
        apiKey: geminiApiKey,
        baseURL:
          "https://generativelanguage.googleapis.com/v1beta/openai/"
      })
    : null;

'''
          s = s.replace(gemini_client, '', 1)

          gemini_model = '''const IMG =
  process.env.GEMINI_IMAGE_MODEL ||
  "gemini-2.5-flash-image";

'''
          s = s.replace(gemini_model, '', 1)

          s = s.replace('if (!geminiImageAi) {', 'if (!comfy.configured) {', 1)
          s = s.replace('[NOCTURNE] Image generation unavailable.', '[NOCTURNE] ComfyUI image generation unavailable.', 1)
          s = s.replace('} else if (geminiImageAi) {', '} else if (false) {', 1)
          s = s.replace('let imageSource = "Gemini";', 'let imageSource = "ComfyUI";', 1)

          if 'geminiImageAi' in s or 'GEMINI_API_KEY' in s or 'GEMINI_IMAGE_MODEL' in s or 'gemini-2.5-flash-image' in s:
              raise SystemExit('Gemini configuration remains')
          if 'if (!comfy.configured)' not in s or 'comfy.request' not in s:
              raise SystemExit('ComfyUI runtime path missing')

          p.write_text(s)
          print('ComfyUI runtime path patched')
          PY
      - name: Validate
        run: |
          node --check nocturne-vercel-3.5/backend/server/game.js
          git diff --check
          ! grep -nE 'GEMINI|gemini|geminiImageAi|gemini-2.5' nocturne-vercel-3.5/backend/server/game.js
          grep -n 'comfy.configured\|comfy.request' nocturne-vercel-3.5/backend/server/game.js
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add nocturne-vercel-3.5/backend/server/game.js
          git diff --cached --quiet || git commit -m 'Make ComfyUI the only image engine'
          git push
