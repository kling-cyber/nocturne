name: Apply dynamic camera network
on:
  push:
    paths: ['.github/nocturne-camera-patch-trigger-5']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: |
          python - <<'PY'
          from pathlib import Path
          g=Path('nocturne-vercel-3.5/backend/server/game.js'); t=g.read_text()
          if 'require("./camera-network")' not in t:
              t=t.replace('const crypto = require("crypto");','const crypto = require("crypto");\n\nconst { buildCameraNetwork, getCamera } = require("./camera-network");',1)
          if 'this.cameras = [];' not in t:
              t=t.replace('    this.imageBusy = false;','    this.imageBusy = false;\n\n    this.cameras = [];',1)
          if 'this.cameras = buildCameraNetwork(this.world[1]);' not in t:
              t=t.replace('    this.truth = {\n\n      killerId:','    this.cameras = buildCameraNetwork(this.world[1]);\n\n    this.truth = {\n\n      killerId:',1)
          if '      cameras:' not in t:
              t=t.replace('      clock:\n        this.clock(),','      clock:\n        this.clock(),\n\n      cameras:\n        this.cameras.map(c => ({ id:c.id, area:c.area, type:c.type, position:c.position, view:c.view })),',1)
          old='''    const cameraId =\n      clean(\n        payload.cameraId ||\n          "CAM-01",\n        30\n      );'''
          new='''    const requestedCameraId = clean(payload.cameraId || "", 30);\n    const camera = getCamera(this.cameras, requestedCameraId);\n    if (type === "cctv" && !camera) { this.room.io.to(pid).emit("errorMessage", "Invalid CCTV camera for this case. Select one of the available case cameras."); this.imageBusy=false; return; }\n    const cameraId = camera?.id || "EVIDENCE-PHOTO";\n    const evidenceArea = camera?.area || clean(payload.area || actor.location, 120);'''
          if 'const requestedCameraId' not in t: t=t.replace(old,new,1)
          t=t.replace('''Setting:\n${this.world[0]}\n\nArea:\n${actor.location}\n\nSimulated case time:\n${this.clock()}''','''Setting:\n${this.world[0]}\n\nAvailable case locations:\n${this.world[1].join(", ")}\n\nEvidence area:\n${evidenceArea}\n\nCamera ID:\n${camera?.id || "not applicable"}\n\nCamera position:\n${camera?.position || "handheld investigator camera"}\n\nCamera view:\n${camera?.view || "documentary scene view"}\n\nSimulated case time:\n${this.clock()}''',1)
          old='''- believable architecture\n- ordinary environmental objects\n- imperfect lighting\n- subtle sensor noise\n- slight lens or compression artifacts\n- restrained documentary framing\n- realistic evidence photography\n- ambiguous but useful visual details\n- not a cinematic poster'''
          new='''- the venue and evidence area must match the generated case exactly\n- use only architecture, furniture and environmental objects plausible for this venue and area\n- do not substitute a generic location\n- imperfect lighting appropriate to the area\n- subtle sensor noise and realistic optical imperfections\n- restrained documentary framing\n- ambiguous but useful visual details\n- not a cinematic poster\n\nCCTV continuity rules:\n- if this is CCTV, keep the camera physically fixed\n- preserve the same camera position, direction, lens character and environmental layout for repeated frames from this camera\n- allow people, doors, small objects and transient events to change naturally between frames\n- never move the camera or change the room into another location'''
          if old in t: t=t.replace(old,new,1)
          g.write_text(t)
          a=Path('nocturne-vercel-3.5/frontend/app.js'); s=a.read_text(); marker='function visual(type){'; start=s.index(marker); brace=s.index('{',start); d=0; end=0
          for i in range(brace,len(s)):
              if s[i]=='{': d+=1
              elif s[i]=='}':
                  d-=1
                  if d==0: end=i+1; break
          rep='''function visual(type){\n  setBusy(true, type === "cctv" ? "Retrieving CCTV frame..." : "Generating scene photograph...");\n  if(type === "cctv"){\n    const buttons=document.querySelectorAll("[data-camera-id]");\n    if(!buttons.length){setBusy(false);alert("No case cameras are available yet.");return;}\n    const selected=document.querySelector("[data-camera-id].selected");\n    sock.emit("requestVisual",{type:"cctv",cameraId:selected?.dataset.cameraId||buttons[0].dataset.cameraId}); return;\n  }\n  sock.emit("requestVisual",{type:"photo",cameraId:"EVIDENCE-PHOTO"});\n}'''
          s=s[:start]+rep+s[end:]
          if 'id="cameraSelector"' not in s: s=s.replace('<div class="visualbox" id="visualbox">','<div class="cameraSelector" id="cameraSelector"></div>\n      <div class="visualbox" id="visualbox">',1)
          if 'function renderCameraSelector()' not in s:
              h='''function renderCameraSelector(){const box=$("cameraSelector");if(!box)return;const cams=Array.isArray(S.cameras)?S.cameras:[];box.innerHTML=cams.map((c,i)=>`<button class="cameraBtn ${i===0?"selected":""}" data-camera-id="${esc(c.id)}" onclick="selectCamera(this)">${esc(c.id)} · ${esc(c.area)}</button>`).join("");}\nfunction selectCamera(btn){document.querySelectorAll("[data-camera-id]").forEach(b=>b.classList.remove("selected"));btn.classList.add("selected");}\n\n'''
              s=s.replace('function render(){',h+'function render(){',1)
          if '  renderCameraSelector();\n  render();' not in s: s=s.replace('  S=d;\n  render();','  S=d;\n  renderCameraSelector();\n  render();',1)
          a.write_text(s)
          css=Path('nocturne-vercel-3.5/frontend/styles.css'); c=css.read_text()
          if '.cameraSelector{' not in c: c+='''\n\n.cameraSelector{display:flex;flex-wrap:wrap;gap:7px;margin:0 0 10px}.cameraBtn{border:1px solid var(--line2);border-radius:7px;padding:8px 10px;background:#151a21;color:var(--soft);font-family:"IBM Plex Mono",monospace;font-size:10px;font-weight:600;letter-spacing:.03em;line-height:1.25;cursor:pointer}.cameraBtn:hover{border-color:var(--accent);color:var(--accent);background:#11161c}.cameraBtn.selected{border-color:var(--accent);color:var(--accent);box-shadow:0 0 0 1px rgba(217,255,98,.12) inset}@media(max-width:700px){.cameraSelector{gap:6px}.cameraBtn{font-size:9px;padding:7px 8px}}\n'''
          css.write_text(c)
          PY
      - name: Validate and commit
        run: |
          node --check nocturne-vercel-3.5/backend/server/game.js
          node --check nocturne-vercel-3.5/frontend/app.js
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add nocturne-vercel-3.5/backend/server/game.js nocturne-vercel-3.5/backend/server/camera-network.js nocturne-vercel-3.5/frontend/app.js nocturne-vercel-3.5/frontend/styles.css
          git diff --cached --check
          git commit -m 'Add case-aware dynamic CCTV cameras'
          git push
