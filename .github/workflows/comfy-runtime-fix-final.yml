name: NOCTURNE ComfyUI runtime final
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply runtime config
        run: |
          python - <<'PY'
          from pathlib import Path

          game = Path('nocturne-vercel-3.5/backend/server/game.js')
          s = game.read_text()

          # Force the visual engine gate to ComfyUI.
          s = s.replace('if (!comfy.configured) {', 'if (!comfy.configured) {', 1)
          s = s.replace('} else if (geminiImageAi) {', '} else if (false) {', 1)
          s = s.replace('let imageSource = "Gemini";', 'let imageSource = "ComfyUI";', 1)

          # Remove stale Gemini references from diagnostics and fallback text.
          s = s.replace('!!geminiApiKey', 'false')
          s = s.replace('IMG\n      );', 'comfy.CHECKPOINT\n      );')
          s = s.replace('Check GEMINI_API_KEY and GEMINI_IMAGE_MODEL on Render and redeploy.', 'Check COMFYUI_URL on Render and make sure the Cloudflare ComfyUI tunnel is online.')
          s = s.replace('`[NOCTURNE] Image request started. engine=${comfy.configured ? "ComfyUI" : "Gemini"}', '`[NOCTURNE] Image request started. engine=ComfyUI')
          s = s.replace('"No image engine is configured. Set COMFYUI_URL for local ComfyUI, or configure GEMINI_API_KEY for Gemini."', '"No image engine is configured. Set COMFYUI_URL for local ComfyUI."')

          # Make ComfyUI settings match the proven local workflow.
          client = Path('nocturne-vercel-3.5/backend/server/comfy-client.js')
          c = client.read_text()
          c = c.replace('process.env.COMFYUI_CFG || 7.5', 'process.env.COMFYUI_CFG || 8')
          c = c.replace('process.env.COMFYUI_SCHEDULER || "normal"', 'process.env.COMFYUI_SCHEDULER || "simple"')
          client.write_text(c)
          game.write_text(s)
          print('ComfyUI runtime configuration applied')
          PY
      - name: Validate
        run: |
          node --check nocturne-vercel-3.5/backend/server/game.js
          node --check nocturne-vercel-3.5/backend/server/comfy-client.js
          git diff --check
      - name: Commit and clean temporary workflows
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add nocturne-vercel-3.5/backend/server/game.js nocturne-vercel-3.5/backend/server/comfy-client.js
          git rm -f .github/workflows/fix-comfy-only.yml .github/workflows/comfy-only-fix2.yml .github/workflows/comfy-only-fix3.yml .github/workflows/comfy-runtime-fix.yml .github/workflows/comfy-runtime-fix-final.yml .github/workflows/final-comfy-fix.yml .github/workflows/finalize-comfy-only.yml 2>/dev/null || true
          git commit -m 'Finalize ComfyUI-only image generation'
          git push
