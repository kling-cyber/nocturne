name: Fix remaining image runtime reference

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Remove stale IMG reference
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('nocturne-vercel-3.5/backend/server/game.js')
          s = p.read_text()
          old = '        "[NOCTURNE] Image model:",\n        IMG\n'
          if old in s:
              s = s.replace(old, '        "[NOCTURNE] ComfyUI checkpoint:",\n        comfy.CHECKPOINT\n', 1)
          else:
              s = s.replace('        IMG\n', '        comfy.CHECKPOINT\n', 1)
          if '\n        IMG\n' in s:
              raise SystemExit('Stale IMG reference remains')
          p.write_text(s)
          print('Removed stale IMG runtime reference')
          PY

      - name: Validate
        run: |
          node --check nocturne-vercel-3.5/backend/server/game.js
          node --check nocturne-vercel-3.5/backend/server/comfy-client.js
          git diff --check

      - name: Commit and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add nocturne-vercel-3.5/backend/server/game.js
          git rm .github/workflows/fix-img-reference.yml
          git commit -m 'Fix stale ComfyUI image reference'
          git push
