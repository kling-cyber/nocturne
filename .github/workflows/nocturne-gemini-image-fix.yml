name: NOCTURNE Gemini Image Migration

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch game.js
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('nocturne-vercel-3.5/backend/server/game.js')
          s = p.read_text(encoding='utf-8')

          if 'const geminiImageAi' in s:
              print('Gemini image configuration already present')
              raise SystemExit(0)

          s, n = re.subn(
              r'(const apiKey\s*=\s*\n\s*String\(process\.env\.OPENAI_API_KEY\s*\|\|\s*""\)\.trim\(\);)',
              r'\1\n\nconst geminiApiKey =\n  String(process.env.GEMINI_API_KEY || "").trim();',
              s,
              count=1
          )
          if n != 1:
              raise SystemExit('Could not locate OPENAI_API_KEY configuration')

          s, n = re.subn(
              r'(const ai\s*=\s*\n\s*OpenAI\s*&&\s*apiKey\s*\n\s*\?\s*new OpenAI\(\{ apiKey \}\)\s*\n\s*:\s*null;)',
              r'\1\n\nconst geminiImageAi =\n  OpenAI && geminiApiKey\n    ? new OpenAI({\n        apiKey: geminiApiKey,\n        baseURL:\n          "https://generativelanguage.googleapis.com/v1beta/openai/"\n      })\n    : null;',
              s,
              count=1
          )
          if n != 1:
              raise SystemExit('Could not locate OpenAI client configuration')

          s, n = re.subn(
              r'const IMG\s*=\s*\n\s*process\.env\.OPENAI_IMAGE_MODEL\s*\|\|\s*\n\s*"gpt-image-2";',
              'const IMG =\n  process.env.GEMINI_IMAGE_MODEL ||\n  "gemini-2.5-flash-image";',
              s,
              count=1
          )
          if n != 1:
              raise SystemExit('Could not locate image model configuration')

          start = s.index('  async visual(')
          end = s.index('  /* =======================================================\n     PUBLIC STATE', start)
          block = s[start:end]

          block, n = re.subn(r'if \(\s*!ai\s*\) \{', 'if (!geminiImageAi) {', block, count=1)
          if n != 1:
              raise SystemExit('Could not locate visual AI guard')

          block = block.replace('OPENAI_API_KEY present:', 'GEMINI_API_KEY present:')
          block = block.replace('!!apiKey', '!!geminiApiKey', 1)
          block = block.replace('"Image generation is not configured on the NOCTURNE server. Check OPENAI_API_KEY on Render and redeploy."', '"Image generation is not configured on the NOCTURNE server. Check GEMINI_API_KEY and GEMINI_IMAGE_MODEL on Render and redeploy."', 1)
          block = block.replace('Calling OpenAI Images API', 'Calling Gemini Images API', 1)
          block = block.replace('await ai.images.generate({', 'await geminiImageAi.images.generate({', 1)
          block = block.replace('size:\n            "1536x1024",\n\n          quality:\n            "medium"', 'size:\n            "1344x768",\n\n          response_format:\n            "b64_json",\n\n          n:\n            1', 1)
          block = block.replace('OpenAI image request completed.', 'Gemini image request completed.', 1)
          block = block.replace('OpenAI image request completed', 'Gemini image request completed', 1)
          block = block.replace('GPT image responses can provide', 'Gemini image responses can provide', 1)
          block = block.replace('"[NOCTURNE] Model:"', '"[NOCTURNE] Gemini image model:"', 1)

          s = s[:start] + block + s[end:]
          p.write_text(s, encoding='utf-8')
          print('Patched game.js for Gemini image generation')
          PY

      - name: Validate
        run: node --check nocturne-vercel-3.5/backend/server/game.js

      - name: Commit game.js
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nocturne-vercel-3.5/backend/server/game.js
          git diff --cached --quiet && exit 0
          git commit -m "Switch NOCTURNE image generation to Gemini"
          git push