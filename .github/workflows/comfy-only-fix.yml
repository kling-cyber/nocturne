name: Apply ComfyUI-only visual engine
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch game.js
        shell: python
        run: |
          from pathlib import Path
          import re
          p = Path('nocturne-vercel-3.5/backend/server/game.js')
          s = p.read_text()
          s, n1 = re.subn(r'\nconst geminiApiKey\s*=.*?;\n\nconst ai\s*=', '\nconst ai =', s, count=1, flags=re.S)
          s, n2 = re.subn(r'\nconst geminiImageAi\s*=.*?;\n\nconst MODEL\s*=', '\nconst MODEL =', s, count=1, flags=re.S)
          s, n3 = re.subn(r'\nconst IMG\s*=.*?;\n', '\n', s, count=1, flags=re.S)
          old = '''    /*
     * STEP 1
     * Confirm that OpenAI exists.
     */

    if (!geminiImageAi) {

      console.error(
        "[NOCTURNE] Image generation unavailable."
      );'''
          new = '''    /*
     * STEP 1
     * ComfyUI is the only image-generation engine.
     */

    if (!comfy.configured) {

      console.error(
        "[NOCTURNE] ComfyUI image generation unavailable."
      );'''
          if old not in s:
              raise SystemExit('Gemini gate not found')
          s = s.replace(old, new, 1)
          pattern = r'\n\s*\} else if \(geminiImageAi\) \{.*?\n\s*\}\n\n\s*if \(!image\) \{'
          replacement = '\n\n      }\n\n    }\n\n    if (!image) {'
          s, n4 = re.subn(pattern, replacement, s, count=1, flags=re.S)
          if n4 != 1:
              raise SystemExit('Gemini fallback not found')
          s = s.replace('let imageSource = "Gemini";', 'let imageSource = "ComfyUI";', 1)
          p.write_text(s)
          print('patch counts:', n1, n2, n3, n4)
      - name: Validate
        run: |
          node --check nocturne-vercel-3.5/backend/server/game.js
          git diff --check
          if grep -nE 'GEMINI|gemini|geminiImageAi|Image model' nocturne-vercel-3.5/backend/server/game.js; then exit 1; fi
          grep -n 'comfy.configured\|comfy.request' nocturne-vercel-3.5/backend/server/game.js
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add nocturne-vercel-3.5/backend/server/game.js
          git diff --cached --quiet || git commit -m 'Use ComfyUI only for visual evidence'
          git push || true
