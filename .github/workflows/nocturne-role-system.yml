name: NOCTURNE role system bootstrap

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply role system
        shell: python
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          from pathlib import Path
          import os
          import re

          if 'NOCTURNE: apply multiplayer role system' in os.environ.get('COMMIT_MESSAGE',''):
              print('Role system commit already applied.')
              raise SystemExit(0)

          root = Path('nocturne-vercel-3.5')
          game = root / 'backend/server/game.js'
          index = root / 'backend/server/index.js'
          app = root / 'frontend/app.js'

          s = game.read_text(encoding='utf-8')
          old = '''    this.make(players, options);\n    visualBatch.register(this);'''
          new = '''    this.make(players, options);\n    this.configureMultiplayerRoles(players);\n    visualBatch.register(this);'''
          if old not in s: raise SystemExit('game.js constructor anchor not found')
          s = s.replace(old, new, 1)

          anchor = '''  /* =======================================================\n     PERSON\n     ======================================================= */\n\n  person('''
          insert = '''  /* =======================================================\n     MULTIPLAYER ROLE SYSTEM\n     ======================================================= */\n\n  configureMultiplayerRoles(players) {\n    if (this.singlePlayer) return;\n    const humans = this.people.filter(p => p.isPlayer);\n    const killer = this.get(this.truth.killerId);\n    if (!killer) return;\n    for (const p of humans) {\n      if (p.id === killer.id) { p.role = "KILLER"; p.investigatorRole = null; }\n      else p.role = "INVESTIGATOR";\n    }\n    const detective = humans.find(p => p.id !== killer.id);\n    if (detective) { detective.role = "DETECTIVE"; detective.investigatorRole = "Lead Detective"; }\n    const specialtyPool = ["Forensic Analyst","Behavioral Analyst","Digital Investigator","Field Investigator","Investigative Journalist","Security Specialist","Medical Consultant"];\n    let si = 0;\n    for (const p of humans) {\n      if (p.id === killer.id || p.id === detective?.id) continue;\n      p.role = "INVESTIGATOR";\n      p.investigatorRole = specialtyPool[si % specialtyPool.length];\n      si++;\n    }\n    const npcs = this.people.filter(p => !p.isPlayer && p.alive);\n    let ni = 0;\n    const hasDetective = this.people.some(p => p.role === "DETECTIVE");\n    if (!hasDetective && npcs[ni]) { npcs[ni].role = "DETECTIVE"; npcs[ni].investigatorRole = "Lead Detective"; npcs[ni].aiRole = true; ni++; }\n    const hasInvestigator = this.people.some(p => p.role === "INVESTIGATOR");\n    if (!hasInvestigator && npcs[ni]) { npcs[ni].role = "INVESTIGATOR"; npcs[ni].investigatorRole = "Field Investigator"; npcs[ni].aiRole = true; ni++; }\n    for (; ni < npcs.length; ni++) { npcs[ni].role = "NPC"; npcs[ni].aiRole = true; npcs[ni].investigatorRole = null; }\n    this.event("ROLES", "Multiplayer roles assigned: one human Killer, one Detective when available, and Investigator specialists. Missing core roles are filled by NPCs.");\n  }\n\n  roleAction(pid, raw) {\n    const p = this.get(pid);\n    if (!p || !p.alive || this.caseClosed || this.singlePlayer) return;\n    const text = clean(raw, 300).trim();\n    const lower = text.toLowerCase();\n    if (p.role === "KILLER") {\n      if (this.phase !== "CRIME") return this.privateNotice(pid, "KILLER actions are only available during the critical window.");\n      if (lower.startsWith("kill ")) {\n        const name = text.slice(5).trim().toLowerCase();\n        const target = this.people.find(x => x.alive && x.id !== p.id && x.name.toLowerCase() === name);\n        if (!target) return this.privateNotice(pid, "Choose a living target by exact name.");\n        this.truth.victimId = target.id;\n        this.remember(p, "episodic", `I selected ${target.name} as the target during the critical window.`, {confidence:100, importance:100, source:"self"});\n        this.event("PRIVATE", "The Killer selected a target during the critical window.", pid);\n        this.crime();\n        return;\n      }\n      if (lower === "conceal scene") {\n        if (!this.truth.crimeCommitted) return this.privateNotice(pid, "There is no crime scene to conceal yet.");\n        this.add({type:"environmental", title:"Possible scene interference", description:"The crime scene shows signs of limited post-event disturbance. Investigators should corroborate the scene carefully.", reliability:52, source:"scene"});\n        this.event("PRIVATE", "You attempted to conceal or disturb part of the scene. This may create additional evidence.", pid);\n        this.tick(1); this.emit(); return;\n      }\n      return this.privateNotice(pid, "Killer abilities: eliminate a target during the critical window, or conceal the scene after the crime.");\n    }\n    if (p.role === "DETECTIVE") {\n      if (lower === "analyze case") {\n        const recent = this.evidence.slice(-12);\n        const avg = recent.length ? Math.round(recent.reduce((a,e)=>a + Number(e.reliability||0),0) / recent.length) : 0;\n        this.add({type:"analysis", title:"Detective case analysis", description:`The Detective cross-referenced ${recent.length} recent evidence records. Average reported reliability is ${avg}%. This is an analytical lead, not automatic proof.`, reliability:Math.min(95, avg + 10), source:p.name});\n        this.event("INVESTIGATION", `${p.name} performed a case-level evidence analysis.`); this.emit(); return;\n      }\n      if (lower.startsWith("interrogate ")) {\n        const name = text.slice(12).trim().toLowerCase();\n        const target = this.people.find(x => x.alive && x.id !== p.id && x.name.toLowerCase() === name);\n        if (!target) return this.privateNotice(pid, "Choose a living person by exact name.");\n        this.ask(pid, target.id, "Formal interrogation: account for your movements and what you personally remember during the critical period."); return;\n      }\n      if (lower.startsWith("mark suspect ")) {\n        const name = text.slice(13).trim().toLowerCase();\n        const target = this.people.find(x => x.alive && x.name.toLowerCase() === name);\n        if (!target) return this.privateNotice(pid, "Choose a living person by exact name.");\n        target.suspicion = clamp(target.suspicion + 12, 0, 100);\n        this.add({type:"behavioral", title:`Person of interest: ${target.name}`, description:`The Detective marked ${target.name} for focused review. This is an investigative designation, not a verdict.`, reliability:70, source:p.name});\n        this.event("INVESTIGATION", `${p.name} marked ${target.name} as a person of interest.`); this.emit(); return;\n      }\n      return this.privateNotice(pid, "Detective abilities: analyze case, interrogate a person, or mark a suspect.");\n    }\n    if (p.role === "INVESTIGATOR") {\n      if (lower === "forensics") {\n        this.add({type:"trace", title:`Forensic search: ${p.location}`, description:`${p.name} performed a focused field-forensics search for traces, objects and environmental inconsistencies. Findings require corroboration.`, reliability:76, source:p.name});\n        this.event("INVESTIGATION", `${p.name} performed focused forensic work in ${p.location}.`); this.emit(); return;\n      }\n      if (lower.startsWith("track ")) {\n        const name = text.slice(6).trim().toLowerCase();\n        const target = this.people.find(x => x.alive && x.id !== p.id && x.name.toLowerCase() === name);\n        if (!target) return this.privateNotice(pid, "Choose a living person by exact name.");\n        const old = p.location; p.location = target.location;\n        this.remember(p, "observation", `I tracked ${target.name} to ${target.location}.`, {confidence:86, importance:78, source:"self"});\n        this.add({type:"observation", title:`Movement trace: ${target.name}`, description:`${p.name} followed the movement trail of ${target.name} toward ${target.location}.`, reliability:72, source:p.name});\n        this.event("INVESTIGATION", `${p.name} tracked ${target.name} from ${old} toward ${target.location}.`); this.emit(); return;\n      }\n      if (lower === "recon") {\n        const nearby = this.people.filter(x => x.alive && x.location === p.location && x.id !== p.id).map(x=>x.name);\n        this.add({type:"observation", title:`Recon: ${p.location}`, description:`Field reconnaissance found ${nearby.length ? nearby.join(", ") : "no other visible people"} in the area at the time of inspection.`, reliability:68, source:p.name});\n        this.event("INVESTIGATION", `${p.name} performed reconnaissance in ${p.location}.`); this.emit(); return;\n      }\n      return this.privateNotice(pid, "Investigator abilities: forensics, track a person, or recon an area.");\n    }\n  }\n\n  privateNotice(pid, text) { this.room.io.to(pid).emit("errorMessage", text); }\n\n\n  /* =======================================================\n     PERSON\n     =======================================================\n\n  person('''
          if anchor not in s: raise SystemExit('game.js person anchor not found')
          s = s.replace(anchor, insert, 1)
          old = '''      role:\n        killer\n          ? "KILLER"\n          : "INVESTIGATOR",'''
          new = '''      role:\n        killer\n          ? "KILLER"\n          : (isPlayer ? "INVESTIGATOR" : "NPC"),'''
          if old not in s: raise SystemExit('game.js person role anchor not found')
          s = s.replace(old, new, 1)
          old = '''  killerDecision(pid) {\n\n    const p =\n      this.get(pid);\n\n\n    if (\n      !p ||\n      p.id !==\n        this.truth.killerId ||\n      this.singlePlayer ||\n      this.phase !==\n        "CRIME"\n    ) {\n\n      return;\n    }\n\n\n    this.remember(\n      p,\n      "episodic",\n      "I committed to the critical decision. The hidden case event now resolves.",\n      {\n        confidence: 100,\n        importance: 100,\n        source: "self"\n      }\n    );\n\n\n    this.event(\n      "PRIVATE",\n      "You committed to the critical decision. The case has moved past the critical window.",\n      pid\n    );\n\n\n    this.crime();\n  }'''
          new = '''  killerDecision(pid) {\n    this.roleAction(pid, "kill");\n  }'''
          if old not in s: raise SystemExit('game.js killerDecision block not found')
          s = s.replace(old, new, 1)
          old = '''    const base = {\n\n      playerId:\n        p.id,\n\n      role:\n        p.role,\n\n      investigatorRole:\n        p.investigatorRole,'''
          new = '''    const abilities = p.role === "KILLER"\n      ? ["ELIMINATE", "CONCEAL SCENE"]\n      : p.role === "DETECTIVE"\n        ? ["ANALYZE CASE", "INTERROGATE", "MARK SUSPECT"]\n        : p.role === "INVESTIGATOR"\n          ? ["FORENSICS", "TRACK", "RECON"]\n          : [];\n\n    const base = {\n\n      playerId:\n        p.id,\n\n      role:\n        p.role,\n\n      investigatorRole:\n        p.investigatorRole,\n\n      abilities,'''
          if old not in s: raise SystemExit('game.js private state anchor not found')
          s = s.replace(old, new, 1)
          game.write_text(s, encoding='utf-8')

          s = index.read_text(encoding='utf-8')
          old = '''  socket.on("killerDecision",()=>{const room=findRoom(socket);if(room)room.killerDecision(socket.id);});'''
          new = '''  socket.on("killerDecision",()=>{const room=findRoom(socket);if(room)room.killerDecision(socket.id);});\n  socket.on("roleAction",payload=>{const room=findRoom(socket);if(room?.sim)room.sim.roleAction(socket.id,clean(payload?.action,300));});'''
          if old not in s: raise SystemExit('index role endpoint anchor not found')
          s = s.replace(old, new, 1)
          index.write_text(s, encoding='utf-8')

          s = app.read_text(encoding='utf-8')
          pattern = re.compile(r'''  /\* ACTIONS \*/\n\n  if\('\''act'\''\)\{.*?\n  \}\n\n\n  /\* INVESTIGATION \*/''', re.S)
          replacement = '''  /* ACTIONS */\n\n  if($('act')){\n    const role = me?.role || 'INVESTIGATOR';\n    const roleCards = role === 'KILLER' ? `\n      <div class="rolePanel killerPanel"><h3>KILLER ABILITIES</h3><div class="action-grid">\n        <div class="card danger" onclick="killerRoleAction('kill')"><b>ELIMINATE</b><p>Choose a living target during the critical window.</p></div>\n        <div class="card danger" onclick="roleAction('CONCEAL SCENE')"><b>CONCEAL SCENE</b><p>Disturb the scene after the crime. This can create evidence.</p></div>\n      </div></div>\n    ` : role === 'DETECTIVE' ? `\n      <div class="rolePanel detectivePanel"><h3>DETECTIVE ABILITIES</h3><div class="action-grid">\n        <div class="card" onclick="roleAction('ANALYZE CASE')"><b>ANALYZE CASE</b><p>Cross-reference recent evidence.</p></div>\n        <div class="card" onclick="namedRoleAction('INTERROGATE')"><b>INTERROGATE</b><p>Formally question a person.</p></div>\n        <div class="card" onclick="namedRoleAction('MARK SUSPECT')"><b>MARK SUSPECT</b><p>Flag a person of interest for the team.</p></div>\n      </div></div>\n    ` : `\n      <div class="rolePanel investigatorPanel"><h3>INVESTIGATOR ABILITIES</h3><div class="action-grid">\n        <div class="card" onclick="roleAction('FORENSICS')"><b>FORENSICS</b><p>Perform a focused trace and object search.</p></div>\n        <div class="card" onclick="namedRoleAction('TRACK')"><b>TRACK</b><p>Follow a person's movement trail.</p></div>\n        <div class="card" onclick="roleAction('RECON')"><b>RECON</b><p>Survey the current area for nearby activity.</p></div>\n      </div></div>\n    `;\n    const free = $('free')?.value || '';\n    $('act').innerHTML = `\n      ${roleCards}\n      <div class="rolePanel commonPanel"><h3>COMMON ACTIONS</h3><div class="action-grid">\n        ${[['Talk','Talk to someone nearby'],['Move','Move somewhere'],['Search','Search the current area'],['Follow','Follow a person'],['Observe','Wait and observe'],['Recall','Review what I know']].map(x=>`<div class="card" onclick="prefill('${js(x[1])}')"><b>${x[0]}</b><p>${x[1]}</p></div>`).join('')}\n      </div></div>\n      <div class="composer"><input id="free" maxlength="600" placeholder="Describe exactly what your character tries to do…" value="${esc(free)}"><button class="primary" onclick="send()">DO ACTION</button></div>\n    `;\n  }\n\n\n  /* INVESTIGATION */'''
          s2, n = pattern.subn(replacement, s, count=1)
          if n != 1: raise SystemExit(f'app.js action block replacement count={n}')
          s = s2
          anchor = '''function send(){'''
          helpers = '''function roleAction(action){\n  setBusy(true, 'Resolving role ability…');\n  sock.emit('roleAction', {action});\n}\n\nfunction namedRoleAction(kind){\n  const name = prompt(kind + ' · enter the exact character name:');\n  if(!name) return;\n  roleAction(kind + ' ' + name.trim());\n}\n\nfunction killerRoleAction(kind){\n  if(kind !== 'kill') return;\n  const name = prompt('ELIMINATE · enter the exact living target name:');\n  if(!name) return;\n  roleAction('KILL ' + name.trim());\n}\n\n'''
          if anchor not in s: raise SystemExit('app.js send anchor not found')
          s = s.replace(anchor, helpers + anchor, 1)
          s = s.replace('onclick="killerDecision()"', 'onclick="killerRoleAction(\'kill\')"')
          s = s.replace('COMMIT TO THE CRITICAL DECISION', 'ELIMINATE TARGET')
          app.write_text(s, encoding='utf-8')

          wf = Path('.github/workflows/nocturne-role-system.yml')
          if wf.exists(): wf.unlink()

      - name: Commit role system
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nocturne-vercel-3.5/backend/server/game.js nocturne-vercel-3.5/backend/server/index.js nocturne-vercel-3.5/frontend/app.js .github/workflows/nocturne-role-system.yml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "NOCTURNE: apply multiplayer role system"
          git push
