name: Make ComfyUI the only image engine
on:
  push:
    branches:
      - main
  workflow_dispatch:
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch image engine
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('nocturne-vercel-3.5/backend/server/game.js')
          text = path.read_text()

          # Remove Gemini image client declarations and image model constant.
          text, n1 = re.subn(r'\nconst geminiApiKey\s*=.*?\n\s*String\(process\.env\.GEMINI_API_KEY \|\| ""\)\.trim\(\);\n', '\n', text, count=1, flags=re.S)
          text, n2 = re.subn(r'\nconst geminiImageAi\s*=.*?\n\s*\}\);\n', '\n', text, count=1, flags=re.S)
          text, n3 = re.subn(r'\nconst IMG\s*=.*?\n\s*"gemini-2\.5-flash-image";\n', '\n', text, count=1, flags=re.S)

          # The old visual function gates on Gemini. Gate on ComfyUI instead.
          text = text.replace('if (!geminiImageAi) {', 'if (!comfy.configured) {', 1)
          text = text.replace('[NOCTURNE] Image generation unavailable.', '[NOCTURNE] ComfyUI image generation unavailable.', 1)

          # Remove the Gemini fallback branch, from its else-if through its closing brace immediately before the image check.
          pattern = re.compile(r'\n\s*\}\s*else if \(geminiImageAi\)\s*\{.*?\n\s*\}\s*\n\s*if \(!image\)', re.S)
          text, n4 = pattern.subn('\n      }\n\n    }\n\n    if (!image)', text, count=1)

          text = text.replace('let imageSource = "Gemini";', 'let imageSource = "ComfyUI";', 1)

          if n1 != 1 or n2 != 1 or n3 != 1 or n4 != 1:
              raise SystemExit(f'Unexpected patch counts: {n1}, {n2}, {n3}, {n4}')

          path.write_text(text)
          print(f'Patch counts: {n1}, {n2}, {n3}, {n4}')
          PY
      - name: Validate
        run: |
          node --check nocturne-vercel-3.5/backend/server/game.js
          git diff --check
          ! grep -nE 'GEMINI|gemini|geminiImageAi|gemini-2.5' nocturne-vercel-3.5/backend/server/game.js
          grep -n 'comfy.configured\|comfy.request' nocturne-vercel-3.5/backend/server/game.js
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add nocturne-vercel-3.5/backend/server/game.js
          git diff --cached --quiet || git commit -m 'Make ComfyUI the only visual engine'
          git push
